<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1,
                   viewport-fit=cover, user-scalable=no">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#2b2b2b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="MART">
    <meta name="apple-mobile-web-app-status-bar-style"
          content="black-translucent">
    <title>MART</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="stylesheet" href="styles/base.css">
</head>
<body>
    <header id="bar">
        <img id="logo" src="icons/icon-192.png" alt="" width="28" height="28">
        <span id="title">MART</span>
        <button id="undo" type="button" class="icon" aria-label="Undo"
                disabled>&#x21b6;</button>
        <button id="redo" type="button" class="icon" aria-label="Redo"
                disabled>&#x21b7;</button>
        <button id="profiles" type="button" class="icon accent"
                aria-label="Manage profiles" title="Manage profiles"><svg
                class="bar-icon" viewBox="0 0 24 24" aria-hidden="true"><path
                d="M12 3l9 5-9 5-9-5z"/><path d="M3 12.5l9 5 9-5"/><path
                d="M3 16.5l9 5 9-5"/></svg></button>
        <button id="export" type="button" class="icon"
                aria-label="Export" title="Export"><svg class="bar-icon"
                viewBox="0 0 24 24" aria-hidden="true"><path
                d="M12 15V3M7.5 7.5L12 3l4.5 4.5M4 14v5a2 2 0 0 0 2 2h12a2 2 0
                0 0 2-2v-5"/></svg></button>
        <button id="info" type="button" class="icon"
                aria-label="Image information" title="Image information"><svg
                class="bar-icon" viewBox="0 0 24 24" aria-hidden="true"><circle
                cx="12" cy="12" r="9"/><path d="M12 11v6"/><circle cx="12"
                cy="7.6" r=".9" fill="currentColor"/></svg></button>
        <button id="open" type="button" class="icon"
                aria-label="Open another image" title="Open another image"><svg
                class="bar-icon" viewBox="0 0 24 24" aria-hidden="true"><path
                d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2
                2H5a2 2 0 0 1-2-2z"/></svg></button>
        <button id="save" type="button" class="icon accent"
                aria-label="Save profile" title="Save profile" disabled><svg
                class="bar-icon" viewBox="0 0 24 24" aria-hidden="true"><path
                d="M5 3h11l4 4v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1
                1-1z"/><path d="M8 3v5h7V3M8 14h8M8 17h5"/></svg></button>
        <span id="conn" class="dot" title="connection"></span>
    </header>
    <main id="stage">
        <canvas id="view"></canvas>
        <canvas id="crop" hidden></canvas>
        <div id="opening" role="status" hidden></div>
        <div id="toast" role="status" hidden></div>
    </main>
    <section id="panel">
        <nav id="tabs" role="tablist"></nav>
        <div id="tools"></div>
    </section>
    <div id="sheet" hidden>
        <div class="sheet-card" role="dialog" aria-modal="true"
             aria-labelledby="sheet-title">
            <header><h2 id="sheet-title" class="sheet-title"></h2><button
                type="button" class="sheet-close"
                aria-label="Close">&times;</button></header>
            <div class="sheet-body"></div>
        </div>
    </div>
    <div id="overlay" hidden>
        <div class="card">
            <h2 id="ov-title"></h2>
            <p id="ov-text"></p>
            <form id="ov-form" hidden>
                <input id="ov-path" type="text" autocapitalize="off"
                       autocorrect="off" spellcheck="false"
                       placeholder="/path/to/photo.arw"
                       aria-label="Path of the image on the server">
                <button type="submit">Open</button>
            </form>
        </div>
    </div>
    <script type="module" src="app/main.js"></script>
</body>
</html>
