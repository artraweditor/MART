name: MART
options:
  bundleIdPrefix: org.mart
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"        # iPhone and iPad
    ENABLE_USER_SCRIPT_SANDBOXING: NO    # the build scripts read the repo outside the project
    ENABLE_BITCODE: NO
    ARCHS: arm64
    EXCLUDED_ARCHS: x86_64
    MARKETING_VERSION: ${MART_APP_VERSION}        # the version of the host: build-app.sh, native/version.sh
    CURRENT_PROJECT_VERSION: ${MART_APP_BUILD}
    DEVELOPMENT_TEAM: ${MART_TEAM}     # your Apple team: see native/env.sh
targets:
  MART:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: us.pixls.art.MART
        SWIFT_OBJC_BRIDGING_HEADER: Sources/MART-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/Sources
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        IOS_SLICE: device
        "IOS_SLICE[sdk=iphonesimulator*]": simulator
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        OTHER_LDFLAGS:
          - $(SRCROOT)/../build/host-$(IOS_SLICE)/libmart-host.a
          - -lc++
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
    preBuildScripts:
      - name: Build MART host and client
        script: '"$SRCROOT/phases.sh" prebuild'
        basedOnDependencyAnalysis: false
    postCompileScripts:
      - name: Bundle ART.framework, data and client
        script: '"$SRCROOT/phases.sh" bundle'
        basedOnDependencyAnalysis: false
